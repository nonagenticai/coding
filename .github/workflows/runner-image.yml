# The job image: toolchain + `coding-runner`, the ENTRYPOINT of every runner Pod.
#
# ⛔ Why this is its own workflow and not a job in `ci-public.yml`:
#   1. The private-era build called the estate's `image-only.yml` reusable workflow on a
#      self-hosted ARC runner. A public repository can use neither — the reusable workflow is
#      private, and both ARC groups refuse public repositories — so the job would sit QUEUED
#      forever with no error anywhere (see the same warning at the top of `ci-public.yml`).
#   2. The job image is several GB. Running it through the same job as the control-plane image
#      would make every ordinary PR pay for a second full Rust build.
#
# The image is pinned BY DIGEST in gitops (`CODING_RUNNER_IMAGE=…@sha256:…`): the worker's
# sandbox refuses a tag-only value, so a bad pin is a CrashLoop, never a silent downgrade.
# Read the digest from this run's summary, or `docker buildx imagetools inspect`.
name: runner image

on:
  pull_request:
    paths:
      - "images/runner-rust/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/runner-image.yml"
  push:
    branches: [main]
    paths:
      - "images/runner-rust/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/runner-image.yml"
  workflow_dispatch: {}

# A PR build must never cancel the main build that publishes the digest.
concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMG: coding-runner:ci
      REF: ghcr.io/${{ github.repository }}-runner
    steps:
      - uses: actions/checkout@v7

      # The runner image is the one build here heavy enough to need the space: the Rust
      # toolchain plus a release build of the crate live in docker storage alongside the
      # final image. These four preinstalled toolchains are never used by this job.
      - name: free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # ⛔ Built on every matching run, pushed only from main. Gating the build on the push
      #   condition is how a Dockerfile stops being compiled at all until release day; the
      #   private-era workflow made exactly that mistake and had it recorded in its header.
      - name: build
        run: docker build --file images/runner-rust/Dockerfile --tag "$IMG" .

      # The only property this image must have at build time: it execs. The real proof is a
      # kata Pod running a job, which no docker step can substitute for.
      - name: smoke
        run: docker run --rm "$IMG" --version

      - name: push to ghcr.io (main only)
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sha="sha-${GITHUB_SHA::7}"
          run="$(printf 'main-%06d' "${{ github.run_number }}")"
          for tag in "$sha" "$run" latest; do
            docker tag "$IMG" "$REF:$tag"
            docker push "$REF:$tag"
          done
          # The digest the deployment must pin. RepoDigests is what the registry served,
          # not a locally computed hash.
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REF:$sha")"
          {
            echo "### runner image pushed"
            echo ""
            echo "- \`$REF:$sha\`"
            echo "- \`$REF:$run\`"
            echo "- \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
